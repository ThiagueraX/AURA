<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#08090c" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feGaussianBlur stdDeviation="15" result="coloredBlur2"/>
      <feMerge>
        <feMergeNode in="coloredBlur2"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ea560d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Light Circles -->
  <circle cx="400" cy="200" r="140" fill="#00a8ff" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="400" cy="230" r="80" fill="#00f0ff" opacity="0.08" filter="url(#neonGlow)" />

  <!-- Geometric Emblem / Icon -->
  <g transform="translate(400, 160)" filter="url(#neonGlow)">
    <!-- Outer Diamond / Circle Motif -->
    <polygon points="0,-75 65,0 0,75 -65,0" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.4" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6" />
    
    <!-- Stylized Futuristic 'A' -->
    <path d="M0 -55 L40 45 L20 45 L0 -5 L-20 45 L-40 45 Z" fill="url(#neonCyan)" />
    <path d="M-15 18 L15 18 L0 -12 Z" fill="#08090c" />
    
    <!-- Central Energy Wave -->
    <path d="M-30 8 Q0 -15 30 8" fill="none" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Main Logotype: AURA -->
  <text x="400" y="325" 
        font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="16" 
        text-anchor="middle" 
        fill="#ffffff" 
        filter="url(#neonGlow)">
    AURA
  </text>

  <!-- Subtitle: MOCOCA -->
  <text x="400" y="370" 
        font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#00f0ff" 
        filter="url(#subtleGlow)">
    MOCOCA
  </text>

  <!-- Decorative Separator Lines -->
  <line x1="220" y1="395" x2="350" y2="395" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.7" />
  <circle cx="400" cy="395" r="3.5" fill="#ea560d" filter="url(#subtleGlow)" />
  <line x1="450" y1="395" x2="580" y2="395" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.7" />

  <!-- Tagline -->
  <text x="400" y="425" 
        font-family="'Inter', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#94a3b8">
    NIGHTCLUB &amp; SHOWS • PREMIUM EXPERIENCE
  </text>
</svg>
